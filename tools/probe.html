<!doctype html><meta charset="utf-8"><body style="font:12px monospace;white-space:pre-wrap;padding:8px"><div id="o">…</div>
<script>
const p=new URLSearchParams(location.search),W=+(p.get('w')||390);
const f=document.createElement('iframe');
f.style.cssText='width:'+W+'px;height:1200px;border:0;position:absolute;left:-9999px';
f.src=p.get('u')||'/';document.body.appendChild(f);
f.onload=()=>setTimeout(()=>{
 const d=f.contentDocument,o=[];
 d.querySelectorAll('.rail').forEach((r,i)=>{
  const rr=r.getBoundingClientRect(),k=r.firstElementChild.getBoundingClientRect();
  o.push('rail'+i+' L'+Math.round(rr.left)+' W'+Math.round(rr.width)+' padL='+getComputedStyle(r).paddingLeft+' firstChildL='+Math.round(k.left)+' scrollL='+r.scrollLeft);
 });
 const g=d.querySelector('.gal__track img');if(g)o.push('galImg '+Math.round(g.getBoundingClientRect().width)+'x'+Math.round(g.getBoundingClientRect().height));
 document.getElementById('o').textContent=o.join('\n');
},2500);
</script>
