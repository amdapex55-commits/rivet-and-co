<!doctype html><meta charset="utf-8">
<style>body{margin:0;background:#F6F3ED;font:12px Archivo,Helvetica,Arial;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:12px}
figure{margin:0}img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee;border-radius:4px}figcaption{padding:4px 2px;letter-spacing:.06em}</style>
<div id=o style="display:contents"></div>
<script src="../public/assets/js/fabric.js"></script>
<script>
const combos=[
 ['flat','dark-indigo','slim'],['flat','mid-blue','straight'],['flat','acid-wash','relaxed'],
 ['flat','washed-black','tapered'],['flat','stone-blue','jogger'],['flat','ecru','straight'],
 ['back','dark-indigo','straight'],['back','mid-blue','slim'],['back','acid-wash','jogger'],
 ['detail','dark-indigo',''],['detail','acid-wash',''],['detail','mid-blue',''],
 ['crop','dark-indigo','slim'],['crop','mid-blue','relaxed'],['crop','acid-wash','straight'],
 ['stack','dark-indigo',''],['texture','dark-indigo',''],['swatch','ecru','']
];
o.innerHTML=combos.map((c,i)=>`<figure><img src="${Fabric.url({shot:c[0],wash:c[1],fit:c[2],seed:i*7+3})}"><figcaption>${c[0]} · ${c[1]} · ${c[2]}</figcaption></figure>`).join('');
</script>
